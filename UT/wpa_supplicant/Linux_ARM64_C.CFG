ASSEMBLER_CMD: 
COVERAGE_TYPE: Statement+Branch
COVERAGE_IO_TYPE: VCAST_COVERAGE_IO_REAL_TIME
C_COMPILER_HIERARCHY_STRING: GNU Target_ARM64_SIMULATOR_C
C_COMPILER_NAME: GNU TARGET_ARM64 Generic (C)
C_COMPILE_CMD: $(VCAST_COMPILER_GCC) -c -g -march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57 --sysroot=/poky/build/tmp-glibc/work/aarch64-oe-linux/wpa-supplicant/git-r5.2/recipe-sysroot
C_COMPILE_CMD_FLAG: -c
C_COMPILE_CMD_NAME: $(VCAST_COMPILER_NAME)-gcc
C_COMPILE_EXCLUDE_FLAGS: -o**
C_DEBUG_CMD: bash ./simulator_qemu_debug.sh aarch64 12345 aarch64 $(QEMU_LIBRARY)
C_DEBUG_OPTIONS: 
C_DEFINE_FLAG: -D
C_DEFINE_LIST: 
C_EDG_FLAGS: -w --gcc --gnu_version 70300 --64_bit_target --x86_64
C_EXECUTE_CMD: qemu-aarch64 -L $(QEMU_LIBRARY)
C_INCLUDE_FLAG: -I
C_INCLUDE_LIST: 
C_LINK_CMD: $(VCAST_COMPILER_GCC) -g -march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57 --sysroot=/poky/build/tmp-glibc/work/aarch64-oe-linux/wpa-supplicant/git-r5.2/recipe-sysroot
C_LINK_OPTIONS: 
C_MAKE_ALL_CMD: make -n -f {file}
C_OBJECT_EXT: .o 
C_OUTPUT_FLAG: -o
C_PREPROCESS_CMD: $(VCAST_COMPILER_GCC) -E -ftrack-macro-expansion=0 -C -march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57 --sysroot=/poky/build/tmp-glibc/work/aarch64-oe-linux/wpa-supplicant/git-r5.2/recipe-sysroot
C_PREPROCESS_FILE: 
C_SYNTAX_CHECK_FLAG: -S
EXECUTABLE_EXTENSION: 
PRECOMPILE_CMD: 
PRECOMPILE_EXT: 
SBF_LOC_MEMBER_IN_NSP: DECL_NAMESPACE
SBF_LOC_MEMBER_OUTSIDE_NSP: DECL_NAMESPACE
SBF_LOC_NONMEMBER_IN_NSP: DECL_NAMESPACE
SBF_LOC_NONMEMBER_OUTSIDE_NSP: DECL_NAMESPACE
SOURCE_EXTENSION: .c
STARTUP_FILE: 
SUBSTITUTE_CODE_FOR_C_FILE: FALSE
TARGET_VARIANT: HOST
VCAST_ALT_WB_METHOD:  0
VCAST_ASSEMBLY_FILE_EXTENSIONS: s
VCAST_AUTO_CLEAR_TEST_USER_CODE: FALSE
VCAST_BUFFER_OUTPUT: FALSE
VCAST_COLLAPSE_STD_HEADERS: COLLAPSE_SYSTEM_HEADERS
VCAST_COMMAND_LINE_DEBUGGER: TRUE
VCAST_COMPILER_SUPPORTS_CPP_CASTS: FALSE
VCAST_DISABLE_CPP_EXCEPTIONS: FALSE
VCAST_DISABLE_STD_CONTAINER_DETECTION: FALSE
VCAST_DISABLE_STD_STRING_DETECTION: FALSE
VCAST_DISABLE_STD_WSTRING_DETECTION: TRUE
VCAST_DUMP_BUFFER: FALSE
VCAST_ENVIRONMENT_FILES: /vcast/Linux_Genereal_cross_GNU/CFG/simulator_qemu_debug.sh
VCAST_ESCAPE_LINE_DIRECTIVES: FALSE
VCAST_EXECUTE_WITH_STDIO: FALSE
VCAST_EXECUTE_WITH_STDOUT: TRUE
VCAST_FAR_STDIN_DATA: FALSE
VCAST_FILE_INDEX: FALSE
VCAST_FILE_PREFIX: 
VCAST_FORCE_ELAB_TYPE_SPEC: TRUE
VCAST_FORCE_NO_USERGLOBALS: FALSE
VCAST_GH_INTEX_CMD: 
VCAST_GH_INT_FILE: 
VCAST_HAS_LONGLONG: TRUE
VCAST_INST_FILE_MAX_LINES: 0
VCAST_MAX_COVERED_SUBPROGRAMS:  1000
VCAST_MAX_MCDC_STATEMENTS:  1000
VCAST_MAX_STRING_LENGTH:  1000
VCAST_MICROSOFT_LONG_LONG: FALSE
VCAST_NO_LIMITS: FALSE
VCAST_NO_LONG_DOUBLE: FALSE
VCAST_NO_SETJMP: FALSE
VCAST_NO_SIGNAL: TRUE
VCAST_NO_STDIN: TRUE
VCAST_NO_STDLIB: FALSE
VCAST_NO_STD_FILES: FALSE
VCAST_OUTPUT_BUFFER_SIZE:  20000
VCAST_PREPEND_TO_PATH_DIRS: 
VCAST_PREPROCESS_PREINCLUDE: $(VECTORCAST_DIR)/DATA/gnu_native/intrinsics.h
VCAST_REMOVE_PREPROCESSOR_COMMENTS: TRUE
VCAST_RPTS_DEFAULT_FONT_FACE: Arial
VCAST_STDIO: FALSE
VCAST_TEST_ALL_NON_MEMBER_INLINES: FALSE
VCAST_TORNADO_CONSTRUCTOR_CALL_FILE: FALSE
VCAST_UNIT_TYPE: SBF
VCAST_USE_COMPOUND_FOR_BATCH: FALSE
VCAST_USE_EDG_PREPROCESSOR: FALSE
VCAST_USE_STATIC_MEMORY: FALSE
VCAST_USE_STD_STRING: TRUE
VCAST_USE_VCPP: FALSE
VCAST_USE_WINDSH_DOT_BAT: FALSE
VCAST_USE_WINDSH_IO_REDIRECTION: FALSE
VCAST_VXSIM: FALSE
VCAST_VXSIMPC: FALSE
VCAST_VXWORKS: FALSE
WHITEBOX: YES

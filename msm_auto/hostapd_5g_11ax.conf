interface=wlan0
driver=nl80211

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=QSoftAP
hw_mode=a
channel=149

country_code=US
beacon_int=100

macaddr_acl=0
wpa=2
wpa_passphrase=1234567890
wpa_pairwise=CCMP

ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]

ieee80211ac=1
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=1
eap_server=1

require_vht=1
ieee80211ax=1
he_bss_color=63
he_su_beamformer=1
he_su_beamformee=1
he_mu_beamformer=1
he_default_pe_duration=4
he_twt_required=1
he_rts_threshold=16

he_oper_chwidth=1

wps_state=2
ap_setup_locked=1

config_methods=virtual_display virtual_push_button keypad

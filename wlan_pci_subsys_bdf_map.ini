# =============================================================================
# WLAN PCI Subsystem ID to Board-ID Mapping
# =============================================================================
#
# Maps PCIe subsystem identifiers to board_id for BDF selection on
# platforms where board_id is not programmed in OTP.
#
# FORMAT
#   [pcie_dev_<vendor_id>_<device_id>]
#   SUBSYS_<subsys_device_id><subsys_vendor_id> = <board_id>
#
# SECTION HEADER
#   Groups all SUBSYS entries for the same WLAN chip (vendor_id + device_id).
#   Entries under a section are matched only when both the section
#   vendor_id/device_id AND the entry ssid/svid match the physical device.
#   Multiple chips (e.g. KIWI, COLOGNE) each get their own section.
#   Add a new section when a new chip needs subsys-based board_id mapping.
#
# PCIE IDENTIFIER FIELDS
#   vendor_id         WLAN chip vendor           (17CB = Qualcomm)
#   device_id         WLAN chip                  (1107 = KIWI WCN785x)
#   subsys_device_id  first 4 hex of SUBSYS — card design variant
#   subsys_vendor_id  last  4 hex of SUBSYS — OEM identifier
#   board_id value used in BDF file name
#
# EXAMPLE — Lenovo NCM825A (HMT05.1)
#   SUBSYS_E0E917AA = 0x112
#   ssid = E0E9 (card design variant)
#   svid = 17AA (Lenovo OEM identifier)
#   board_id = 0x112 -> bdwlan01.e12 -> bdwlan_wcn785x_2p0_ncm825.elf
#
# HOW TO ADD NEW SUBSYS BASED BOARD-ID
#   1. Get SUBSYS from HW spec, lspci or from customer
#   2. Add section [pcie_dev_VVVV_DDDD] if chip not present
#   3. Add: SUBSYS_<ssid><svid> = <board_id>  # OEM, CardVendor
#
# =============================================================================

[pcie_dev_17CB_1107]

# NCM825A — HMT05.1 — board_id = 0x112 — bdwlan01.e12
SUBSYS_E0E917AA = 0x112  # Lenovo/FCCL, Foxconn
SUBSYS_930A17AA = 0x112  # LENOVO, USI
SUBSYS_E0EE105B = 0x112  # Dell, Foxconn
SUBSYS_E0EF105B = 0x112  # ASUS, Foxconn
SUBSYS_8E64103C = 0x112  # HP, AzureWave

# NCM865A — HMT04.2 — board_id = 0x10f — bdwlan01.e0f
SUBSYS_E107105B = 0x10f  # HP, Foxconn
SUBSYS_8D99103C = 0x10f  # HP, AzureWave
SUBSYS_E11517AA = 0x10f  # Lenovo, Foxconn
SUBSYS_E129105B = 0x10f  # ASUS, Foxconn
SUBSYS_337C17CB = 0x10f  # Qualcomm CRD
